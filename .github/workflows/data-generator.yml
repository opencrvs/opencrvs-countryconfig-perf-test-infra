name: 0. Generate performance data
run-name: "Generate performance data on ${{ inputs.environment }}"
on:
  workflow_call:
    inputs:
      environment:
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: ""
        type: choice
        options:
          - "perftest"

env:
  # Assuming chart version matches core image tag
  ENV: ${{ inputs.environment }}
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    name: data-generator on ${{ inputs.environment }}
    timeout-minutes: 420
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy with Helm
        id: deploy
        run: |
          touch environments/${ENV}/data-generator.yaml
          helm upgrade --install data-generator oci://ghcr.io/opencrvs/data-generator \
            -f environments/${ENV}/data-generator.yaml \
            --timeout 15m \
            --namespace "opencrvs-${ENV}" \
            --set postgres.user=${{ secrets.POSTGRES_USER }} \
            --set postgres.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set postgres.host=postgres-0.postgres.opencrvs-deps-${ENV}.svc.cluster.local \
            --set env.count=${{ vars.GENERATE_DATA_COUNT_RECORDS }} \
            --set env.sleepMs=0 \
            --set env.batchSize=${{ vars.GENERATE_DATA_BATCH_SIZE }}
      - name: Stream job logs
        run: |
          stern -n "opencrvs-${ENV}" \
            -l "app.kubernetes.io/instance=data-generator,app.kubernetes.io/name=data-generator" \
            --since 1s \
            --tail 0 \
            --exclude '"level":(30|info)' \
            --template '{{.Message}}{{"\n"}}' &
          STERN_PID=$!
          JOB_NAME=$(kubectl -n "opencrvs-${ENV}" get jobs \
            -l "app.kubernetes.io/instance=data-generator" \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1].metadata.name}')
          kubectl -n "opencrvs-${ENV}" wait --for=condition=complete --timeout=6h "job/${JOB_NAME}"
          STATUS=$?
          kill $STERN_PID 2>/dev/null || true
          exit $STATUS
      - name: Cleanup Helm Locks
        if: failure() || cancelled()
        run: |
          kubectl -n "opencrvs-${ENV}" get secrets -l owner=helm -o json | \
          jq -r '.items[] | select(.metadata.labels.status=="pending-install" or .metadata.labels.status=="pending-upgrade" or .metadata.labels.status=="pending-rollback") | .metadata.name' | \
          xargs -r kubectl -n "opencrvs-${ENV}" delete secret || \
          echo "No helm locks found, all is good"
