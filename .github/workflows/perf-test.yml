name: 0. Performance testing
run-name: "Run performance test (${{ inputs.scenario }}) on ${{ inputs.environment }}"
on:
  workflow_call:
    inputs:
      scenario:
        type: string
      environment:
        type: string
    outputs:
      summary:
        value: ${{ jobs.deploy.outputs.summary }}
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - load
          - soak
          - spike
      environment:
        description: "Target environment"
        required: true
        default: ""
        type: choice
        options:
          - "perftest"

env:
  # Assuming chart version matches core image tag
  ENV: ${{ inputs.environment }}
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    name: perf-test on ${{ inputs.environment }}
    # The soak scenario alone runs for 5h; give it headroom above GitHub's
    # default 360m job timeout so a long-running test isn't cut off.
    timeout-minutes: 420
    outputs:
      summary: ${{ steps.summary.outputs.text }}
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy with Helm
        id: deploy
        run: |
          touch environments/${ENV}/perf-test.yaml
          helm upgrade --install perf-test oci://ghcr.io/opencrvs/perf-test \
            -f environments/${ENV}/perf-test.yaml \
            --timeout 15m \
            --namespace "opencrvs-${ENV}" \
            --set k6_script=${{ inputs.scenario }}
      - name: Stream job logs
        run: |
          stern -n "opencrvs-${ENV}" \
            -l "app.kubernetes.io/instance=perf-test,app.kubernetes.io/name=perf-test" \
            --since 1s \
            --tail 0 \
            --exclude '"level":(30|info)' \
            --template '{{.Message}}{{"\n"}}' &
          STERN_PID=$!
          JOB_NAME=$(kubectl -n "opencrvs-${ENV}" get jobs \
            -l "app.kubernetes.io/instance=perf-test" \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1].metadata.name}')
          echo "JOB_NAME=${JOB_NAME}" >> "$GITHUB_ENV"

          # Start two background checks. One waits for the job to complete.
          # The other waits for the job to fail. Each check writes its result to a file. ($? = exit status of last command)
          RESULT_FILE=$(mktemp)
          kubectl -n "opencrvs-${ENV}" wait --for=condition=complete --timeout=6h "job/${JOB_NAME}" \
            && echo complete > "$RESULT_FILE" &
          WAIT_FOR_COMPLETE=$!
          kubectl -n "opencrvs-${ENV}" wait --for=condition=failed --timeout=6h "job/${JOB_NAME}" \
            && echo failed > "$RESULT_FILE" &
          WAIT_FOR_FAILED=$!

          # Wait until one check finishes. Then stop both checks.
          # Perf tests are time based. Intentionally stopped check exits with 143. "|| true" keeps that from failing the step.
          wait -n "$WAIT_FOR_COMPLETE" "$WAIT_FOR_FAILED" || true
          kill "$WAIT_FOR_COMPLETE" "$WAIT_FOR_FAILED" 2>/dev/null || true
          wait "$WAIT_FOR_COMPLETE" "$WAIT_FOR_FAILED" 2>/dev/null || true
          kill $STERN_PID 2>/dev/null || true

          RESULT=$(cat "$RESULT_FILE")
          rm -f "$RESULT_FILE"

          if [ "$RESULT" != "complete" ]; then
            echo "Job ${JOB_NAME} did not complete (result: ${RESULT:-none})" >&2
            exit 1
          fi
      - name: Collect k6 summary
        id: summary
        if: always()
        run: |
          {
            echo 'text<<EOF'
            kubectl -n "opencrvs-${ENV}" logs "job/${JOB_NAME}" \
              | grep -o '{"slack_summary".*}' | tail -1 | jq -r .slack_summary || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Cleanup Helm Locks
        if: failure() || cancelled()
        run: |
          kubectl -n "opencrvs-${ENV}" get secrets -l owner=helm -o json | \
          jq -r '.items[] | select(.metadata.labels.status=="pending-install" or .metadata.labels.status=="pending-upgrade" or .metadata.labels.status=="pending-rollback") | .metadata.name' | \
          xargs -r kubectl -n "opencrvs-${ENV}" delete secret || \
          echo "No helm locks found, all is good"
