name: 0. Performance testing
run-name: "Run performance test (${{ inputs.scenario }}) on ${{ inputs.environment }}"
on:
  workflow_call:
    inputs:
      scenario:
        type: string
      environment:
        type: string
      perf_test_branch:
        type: string
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - load
          - soak
          - spike
      environment:
        description: "Target environment"
        required: true
        default: ""
        type: choice
        options:
          - "perftest"
      perf_test_branch:
        description: "Branch of opencrvs/performance-test to run. Leave empty to use the image the chart defaults to."
        required: false
        default: ""
        type: string

env:
  # Assuming chart version matches core image tag
  ENV: ${{ inputs.environment }}
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    name: perf-test on ${{ inputs.environment }}
    # The soak scenario alone runs for 5h; give it headroom above GitHub's
    # default 360m job timeout so a long-running test isn't cut off.
    timeout-minutes: 420
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      # The k6 code reaches the cluster as a container image, not as a checkout.
      # Every push to performance-test publishes `<short sha>` and moves `latest`,
      # so pinning the tag is the only way to run a specific branch's test code.
      - name: Resolve performance-test image
        id: perf_test_image
        env:
          PERF_TEST_BRANCH: ${{ inputs.perf_test_branch }}
        run: |
          if [[ -z "$PERF_TEST_BRANCH" ]]; then
            echo "No branch given; using the image tag the chart defaults to."
            echo "helm_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA=$(git ls-remote https://github.com/opencrvs/performance-test \
            "refs/heads/$PERF_TEST_BRANCH" | cut -f1)

          if [[ -z "$SHA" ]]; then
            echo "::error::Branch '$PERF_TEST_BRANCH' not found in opencrvs/performance-test"
            exit 1
          fi

          echo "Running $PERF_TEST_BRANCH at ${SHA:0:7}"
          echo "helm_args=--set image.tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Deploy with Helm
        id: deploy
        run: |
          touch environments/${ENV}/perf-test.yaml
          helm upgrade --install perf-test oci://ghcr.io/opencrvs/perf-test \
            -f environments/${ENV}/perf-test.yaml \
            --timeout 15m \
            --namespace "opencrvs-${ENV}" \
            --set k6_script=${{ inputs.scenario }} \
            ${{ steps.perf_test_image.outputs.helm_args }}
      - name: Stream job logs
        run: |
          stern -n "opencrvs-${ENV}" \
            -l "app.kubernetes.io/instance=perf-test,app.kubernetes.io/name=perf-test" \
            --since 1s \
            --tail 0 \
            --exclude '"level":(30|info)' \
            --template '{{.Message}}{{"\n"}}' &
          STERN_PID=$!
          JOB_NAME=$(kubectl -n "opencrvs-${ENV}" get jobs \
            -l "app.kubernetes.io/instance=perf-test" \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1].metadata.name}')

          # Race "complete" against "failed" so a failed job (backoffLimit: 0,
          # so it fails fast) is reported immediately instead of only after the
          # full 6h timeout elapses waiting for a "complete" that will never come.
          OUTCOME_FILE=$(mktemp)
          kubectl -n "opencrvs-${ENV}" wait --for=condition=complete --timeout=6h "job/${JOB_NAME}" \
            && echo complete > "$OUTCOME_FILE" &
          COMPLETE_PID=$!
          kubectl -n "opencrvs-${ENV}" wait --for=condition=failed --timeout=6h "job/${JOB_NAME}" \
            && echo failed > "$OUTCOME_FILE" &
          FAILED_PID=$!

          wait -n "$COMPLETE_PID" "$FAILED_PID"
          if kill -0 "$COMPLETE_PID" 2>/dev/null; then
            kill "$COMPLETE_PID" 2>/dev/null || true
          else
            kill "$FAILED_PID" 2>/dev/null || true
          fi
          wait "$COMPLETE_PID" "$FAILED_PID" 2>/dev/null

          OUTCOME=$(cat "$OUTCOME_FILE" 2>/dev/null || echo unknown)
          rm -f "$OUTCOME_FILE"
          kill $STERN_PID 2>/dev/null || true

          if [ "$OUTCOME" = "complete" ]; then
            exit 0
          else
            echo "Job ${JOB_NAME} did not complete successfully (outcome: ${OUTCOME})" >&2
            exit 1
          fi
      - name: Cleanup Helm Locks
        if: failure() || cancelled()
        run: |
          kubectl -n "opencrvs-${ENV}" get secrets -l owner=helm -o json | \
          jq -r '.items[] | select(.metadata.labels.status=="pending-install" or .metadata.labels.status=="pending-upgrade" or .metadata.labels.status=="pending-rollback") | .metadata.name' | \
          xargs -r kubectl -n "opencrvs-${ENV}" delete secret || \
          echo "No helm locks found, all is good"
