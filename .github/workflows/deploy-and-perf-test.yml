name: 11. Deploy & run performance test
run-name: "Perf test by ${{ github.event.client_payload.actor || github.actor }} (core: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }})"
on:
  repository_dispatch:
    types: [run_perf_test]
  workflow_dispatch:
    inputs:
      core-image-tag:
        description: Core image tag
        default: "develop"
        required: true
concurrency:
  group: "perf-test"
  cancel-in-progress: false
jobs:
  reset-data:
    uses: ./.github/workflows/clear-all-data.yml
    with:
      environment: "perftest"
    secrets: inherit
  build-countryconfig:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: perf-seed
          push: true
          build-args: CORE_IMAGE_TAG=${{ env.TAG }}
          tags: ghcr.io/opencrvs/ocrvs-testland-perf:${{ env.TAG }}
      - name: Reuse testland assets image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/opencrvs/ocrvs-testland-perf:${TAG}-assets \
            ghcr.io/opencrvs/ocrvs-testland:${TAG}-assets
  deploy:
    needs: [reset-data, build-countryconfig]
    uses: ./.github/workflows/deploy-opencrvs.yml
    with:
      core-image-tag: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }}
      environment: "perftest"
      data-seed-enabled: false
    secrets: inherit
  data-seed:
    needs: deploy
    uses: ./.github/workflows/seed-data.yml
    with:
      environment: "perftest"
    secrets: inherit
  generate-data:
    needs: data-seed
    uses: ./.github/workflows/data-generator.yml
    with:
      environment: "perftest"
    secrets: inherit
  perf-test:
    needs: generate-data
    uses: ./.github/workflows/perf-test.yml
    with:
      environment: "perftest"
      scenario: load
    secrets: inherit
  notify:
    needs: perf-test
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ vars.SLACK_PERF_TEST_CHANNEL }}
          slack-message: |
            ${{ needs.perf-test.result == 'success' && '✅' || '❌' }} Performance test: ${{ needs.perf-test.result }} (core: `${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }}`) · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>
            ```${{ needs.perf-test.outputs.summary || 'No k6 summary' }}```
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
