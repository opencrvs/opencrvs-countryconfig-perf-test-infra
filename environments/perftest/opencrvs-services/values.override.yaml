##################################################################################
# Use this file to customize helm chart behavior
# Please make sure your custom changes doesn't conflict with values.yaml
##################################################################################
gateway:
  env:
    DISABLE_RATE_LIMIT: "true"

network_policy:
  ingress_mode: deny
  egress_mode: deny
  allowed_namespaces:
    - opencrvs-deps-perftest

elasticsearch:
  reindex_enabled: false

s3:
  auth_mode: use_secret
  host: minio-0.minio.opencrvs-deps-perftest.svc.cluster.local

countryconfig:
  env:
    OPENID_PROVIDER_CLAIMS: name,family_name,given_name,middle_name,birthdate,address
    OPENID_PROVIDER_CLIENT_ID: mock-client_id
    ESIGNET_REDIRECT_URL: http://esignet-mock:20260/authorize
    MOSIP_API_USERINFO_URL: http://mosip-api:2024/esignet/get-oidp-user-info
